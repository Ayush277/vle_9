<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediCore - Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: {
          50: '#eef2ff',
          100: '#e0e7ff',
          500: '#6366f1',
          600: '#4f46e5',
          700: '#4338ca',
        },
        success: '#22c55e',
        danger: '#ef4444'
      }
    }
  }
}
</script>
</head>

<body class="bg-slate-100 text-slate-800">

<div class="flex h-screen">

<!-- SIDEBAR -->
<aside class="w-64 bg-slate-900 text-slate-300 flex flex-col">

<div class="h-20 flex items-center justify-center text-xl font-bold text-white border-b border-slate-800">
MediCore
</div>

<nav class="flex-1 p-4 space-y-2">

<a class="flex items-center gap-3 px-4 py-3 bg-primary-600 text-white rounded-xl">
<i class="fa-solid fa-chart-pie"></i> Dashboard
</a>

<a class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-xl">
<i class="fa-solid fa-users"></i> Patients
</a>

<a class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-xl">
<i class="fa-solid fa-calendar"></i> Appointments
</a>

<a class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-xl">
<i class="fa-solid fa-user-doctor"></i> Doctors
</a>

</nav>

</aside>

<!-- MAIN -->
<main class="flex-1 flex flex-col">

<!-- HEADER -->
<header class="bg-white h-16 flex items-center justify-between px-6 border-b">

<h1 class="font-semibold text-lg">Dashboard</h1>

<button class="bg-primary-600 text-white px-4 py-2 rounded-xl shadow hover:bg-primary-700 hover:scale-[1.02] transition">
+ New Patient
</button>

</header>

<!-- CONTENT -->
<div class="p-6 space-y-6 overflow-auto">

<!-- CARDS -->
<div class="grid grid-cols-4 gap-6">

<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
<p class="text-sm text-slate-500">Total Patients</p>
<h2 class="text-2xl font-bold">24,592</h2>
</div>

<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
<p class="text-sm text-slate-500">Beds</p>
<h2 class="text-2xl font-bold">142</h2>
</div>

<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
<p class="text-sm text-slate-500">Appointments</p>
<h2 class="text-2xl font-bold">328</h2>
</div>

<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
<p class="text-sm text-slate-500">Revenue</p>
<h2 class="text-2xl font-bold">$1.2M</h2>
</div>

</div>

<!-- CHART -->
<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
<canvas id="chart"></canvas>
</div>

<!-- TABLE -->
<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">

<table class="w-full">

<thead class="bg-slate-100 text-slate-600 text-sm">
<tr>
<th class="p-4 text-left">Patient</th>
<th class="p-4">Doctor</th>
<th class="p-4">Time</th>
<th class="p-4">Status</th>
</tr>
</thead>

<tbody>

<tr class="hover:bg-slate-100 transition">
<td class="p-4">Marcus</td>
<td>Dr. Sarah</td>
<td>9:00 AM</td>
<td class="text-green-600">Done</td>
</tr>

<tr class="hover:bg-slate-100 transition">
<td class="p-4">Emily</td>
<td>Dr. Fox</td>
<td>10:30 AM</td>
<td class="text-yellow-600">Pending</td>
</tr>

</tbody>

</table>

</div>

</div>

</main>
</div>

<script>
const ctx = document.getElementById('chart');

new Chart(ctx, {
type: 'line',
data: {
labels: ['Mon','Tue','Wed','Thu','Fri'],
datasets: [{
label: 'Patients',
data: [10,20,15,30,25],
borderColor: '#6366f1',
backgroundColor: 'rgba(99,102,241,0.2)',
fill: true,
tension: 0.4
}]
}
});
</script>

</body>
</html>
